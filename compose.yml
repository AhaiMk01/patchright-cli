services:
  patchright-mcp:
    image: ghcr.io/ahaimk01/patchright-cli:latest
    container_name: patchright-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      PATCHRIGHT_CLI_MODE: mcp-http
      PATCHRIGHT_CLI_MCP_HEADLESS: "1"
      PATCHRIGHT_CLI_MCP_ROOT: /patchright
      # HTTP mode refuses to start unless you pick a defence against DNS rebinding:
      # (a) set PATCHRIGHT_CLI_MCP_TOKEN (clients send an Authorization header);
      # (b) set FASTMCP_HTTP_HOST_ORIGIN_PROTECTION to "true", so only requests
      #     addressed to localhost, 127.0.0.1 or ::1 are accepted, and list any other
      #     name or IP (such as this service's name) in FASTMCP_HTTP_ALLOWED_HOSTS; or
      # (c) leave it "false" on purpose. This file does (c) so reverse-proxy and MCP
      #     hub setups keep working: a reverse proxy with auth or an IP allowlist can
      #     stand in for the token. Leave the token unset if your client can't send one.
      PATCHRIGHT_CLI_MCP_TOKEN: ${PATCHRIGHT_CLI_MCP_TOKEN:-}
      FASTMCP_HTTP_HOST_ORIGIN_PROTECTION: "false"
      # FASTMCP_HTTP_ALLOWED_HOSTS: '["patchright-mcp", "192.168.1.20"]'
      # Set to 1 only if you intentionally want MCP tools to access paths
      # outside PATCHRIGHT_CLI_MCP_ROOT.
      # PATCHRIGHT_CLI_MCP_UNRESTRICTED_FILESYSTEM: "1"
      # PATCHRIGHT_CLI_MCP_PORT: "9090"
    volumes:
      # Files made available to MCP tools, plus generated output under ./patchright/output.
      - ./patchright:/patchright
      # Persist named browser profiles and login state across container updates.
      - patchright-profiles:/root/.patchright-cli

volumes:
  patchright-profiles:
