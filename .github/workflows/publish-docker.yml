name: docker-publish

on:
  # A release tag publishes the image alongside the PyPI package (publish.yml).
  push:
    tags:
      - 'v*'
  # Manual runs rebuild or republish a tag; they push only when asked to.
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to publish"
        required: true
        type: string
      publish_docker:
        description: "Publish docker image"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  # A tag push has no inputs: it publishes under the tag's own name.
  VERSION_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish_docker }}

jobs:
  docker:
    runs-on: ubuntu-latest
    name: docker-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set Docker image tags
        id: tags
        shell: bash
        run: |
          REPOSITORY="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="ghcr.io/${REPOSITORY}"

          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${VERSION_TAG}"
            echo "${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate with GHCR
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Attestations need the docker-container driver that setup-buildx-action creates above.
          provenance: mode=max
          sbom: true
