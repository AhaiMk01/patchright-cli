name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.7,<0.8"
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run pre-commit run --all-files

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.7,<0.8"
          python-version: ${{ matrix.python-version }}
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run pytest tests/ -v --ignore=tests/test_e2e.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t patchright-cli:ci .
      - run: docker run --rm patchright-cli:ci --help
      - name: Browser session inside the container
        run: |
          docker run -d --name cli --entrypoint sleep patchright-cli:ci infinity
          docker exec cli uv run patchright-cli open https://example.com --headless
          docker exec cli uv run patchright-cli eval document.title | tee title.txt
          grep -q "Example Domain" title.txt
          docker exec cli uv run patchright-cli close
      - name: MCP over HTTP with a token
        run: |
          docker run -d --name mcp -p 9090:9090 -e PATCHRIGHT_CLI_MODE=mcp-http -e PATCHRIGHT_CLI_MCP_TOKEN=ci-token patchright-cli:ci
          for _ in $(seq 30); do curl -s -o /dev/null http://localhost:9090/mcp && break; sleep 1; done
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          headers=(-H "Content-Type: application/json" -H "Accept: application/json, text/event-stream")
          test "$(curl -s -o /dev/null -w '%{http_code}' "${headers[@]}" -d "$init" http://localhost:9090/mcp)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "${headers[@]}" -H "Authorization: Bearer ci-token" -d "$init" http://localhost:9090/mcp)" = 200
          # Host/Origin checks are off by default, so any Host is accepted
          test "$(curl -s -o /dev/null -w '%{http_code}' "${headers[@]}" -H "Authorization: Bearer ci-token" -H "Host: other.example:9090" -d "$init" http://localhost:9090/mcp)" = 200
      - name: MCP over HTTP without a token, Host/Origin checks on
        run: |
          docker run -d --name mcp-open -p 9091:9090 -e PATCHRIGHT_CLI_MODE=mcp-http -e FASTMCP_HTTP_HOST_ORIGIN_PROTECTION=true -e FASTMCP_HTTP_ALLOWED_HOSTS='["patchright-mcp"]' patchright-cli:ci
          for _ in $(seq 30); do curl -s -o /dev/null http://localhost:9091/mcp && break; sleep 1; done
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          headers=(-H "Content-Type: application/json" -H "Accept: application/json, text/event-stream")
          test "$(curl -s -o /dev/null -w '%{http_code}' "${headers[@]}" -d "$init" http://localhost:9091/mcp)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "${headers[@]}" -H "Host: evil.example:9091" -d "$init" http://localhost:9091/mcp)" = 421
          test "$(curl -s -o /dev/null -w '%{http_code}' "${headers[@]}" -H "Origin: http://evil.example" -d "$init" http://localhost:9091/mcp)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' "${headers[@]}" -H "Host: patchright-mcp:9090" -d "$init" http://localhost:9091/mcp)" = 200
      - name: compose.yml works without a token
        run: docker compose config -q
      - if: failure()
        run: |
          docker logs cli || true
          docker logs mcp || true
          docker logs mcp-open || true
